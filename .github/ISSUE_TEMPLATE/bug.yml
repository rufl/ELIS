name: Bug report
description: Report a reproducible simulator, Workshop, package, or compatibility defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security vulnerabilities must be reported privately through SECURITY.md, not here.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Simulator runtime
        - Workshop
        - Lua API compatibility
        - Rendering or scaling
        - Input or controllers
        - Audio
        - Package, archive, or demo downloader
        - Build or CI
        - Documentation
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened, and what should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include exact commands and a minimal cartridge or `.elisworld` project when possible.
      placeholder: |
        1. Build with ...
        2. Run ...
        3. Press ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: ELIS revision, OS, architecture, Zig version, SDL version, input device, and named Lupi board/firmware if physical hardware is involved.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or captures
      description: Paste relevant text logs, hashes, or isolated-display captures. Remove credentials and private paths.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and BACKLOG.md.
          required: true
        - label: This report contains no credential, private vulnerability detail, or unlicensed third-party content.
          required: true
